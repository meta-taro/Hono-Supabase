# =============================================================================
# Cloudflare Workers 設定（cake-shop-api）
#
# このファイルは "本番デプロイ先（Workers）" 専用の設定。
# Node ローカル開発（pnpm dev）には一切影響しない — そちらは tsx watch +
# app/index.node.ts のままで動く。Phase 7 の二段運用ポリシー。
#
# --- 環境運用ポリシー（Step 8）: --env 必須運用 ---
#   wrangler は `--env <name>` を付けると、トップレベルの [vars] / [observability] を
#   無視し、[env.<name>.*] だけを読む（main / compatibility_* などビルド設定は継承）。
#   「素の wrangler deploy」と「wrangler deploy --env production」で挙動が変わる事故を
#   防ぐため、本プロジェクトは必ず --env を付ける運用にする:
#     pnpm wrangler:dev                → ローカル V8 isolate（.dev.vars を読む）
#     pnpm wrangler:deploy:staging     → staging（name=cake-shop-api-staging）へ
#     pnpm wrangler:deploy:production   → production（name=cake-shop-api）へ
#   トップレベルの [vars] / [observability] は「--env 付け忘れ時のフォールバック
#   （= production 相当）」という保険の位置づけ。
#
# secrets と vars の使い分け:
#   - [vars]              … 機密でない設定（NODE_ENV, LOG_LEVEL 等）。コミット OK
#   - wrangler secret put … 機密値（Supabase キー等）。Cloudflare 側に保管、ローカルは .dev.vars
#   secret は Worker 名ごとに別ストア。staging へは `--env staging` を付けて登録する:
#     pnpm wrangler:secret:staging SUPABASE_URL    （対話で値を入力）
# =============================================================================

name = "cake-shop-api"
main = "app/index.workers.ts"
compatibility_date = "2026-05-07"

# Workers 標準モジュール構文（ExportedHandler）を有効化。
# nodejs_compat はあえて入れない:
#   本プロジェクトは jose / @supabase/supabase-js とも Web 標準 fetch ベースなので
#   Node ポリフィルは不要。これがないことが Workers 互換性の証拠でもある。
# （compatibility_date / compatibility_flags / main は [env.*] にも継承される）
compatibility_flags = []

# -----------------------------------------------------------------------------
# トップレベルの [vars] / [observability]
#   = `--env` を付けずに `wrangler deploy` した場合にだけ効く（= production 相当）。
#   本プロジェクトは --env 必須運用なので、通常はこちらではなく [env.*] が使われる。
# -----------------------------------------------------------------------------
[vars]
NODE_ENV = "production"
LOG_LEVEL = "info"

# 観測性: Workers の logs が dashboard 上で 24h 残る。Logpush → Datadog 等へ流す前段。
[observability]
enabled = true

# version_metadata バインディング: この isolate が動かしているデプロイ済みバージョンの
#   { id, tag, timestamp } を env.CF_VERSION_METADATA から取得できる。
#   /health に id を晒して、段階展開（カナリア）中にどのバージョンが応答したかを観察する用途。
#   ★バインディングは [vars] と違い --env では継承されない★ → 下の [env.*] にも同じ宣言が要る。
#   この top-level 宣言は `wrangler dev`（--env なし）で効く。
[version_metadata]
binding = "CF_VERSION_METADATA"

# -----------------------------------------------------------------------------
# staging 環境
#   pnpm wrangler:deploy:staging で name=cake-shop-api-staging に展開。
#   本番に限りなく近い設定で動かす前段環境。LOG_LEVEL だけ debug にして観察しやすく。
#   secret（Supabase キー ×3）は別ストアなので `--env staging` を付けて登録すること。
# -----------------------------------------------------------------------------
[env.staging]
name = "cake-shop-api-staging"

[env.staging.vars]
NODE_ENV = "staging"
LOG_LEVEL = "debug"

[env.staging.observability]
enabled = true

# バインディングは --env で継承されないので、staging にも明示的に宣言する。
[env.staging.version_metadata]
binding = "CF_VERSION_METADATA"

# -----------------------------------------------------------------------------
# production 環境
#   pnpm wrangler:deploy:production で name=cake-shop-api（Step 7 でデプロイ済の本番）へ。
#   Step 7 で `wrangler secret put`（--env なし）で登録した secret は、Worker 名が同じ
#   "cake-shop-api" なので同じ Worker に紐づき、そのまま参照される。
# -----------------------------------------------------------------------------
[env.production]
name = "cake-shop-api"

[env.production.vars]
NODE_ENV = "production"
LOG_LEVEL = "info"

[env.production.observability]
enabled = true

# バインディングは --env で継承されないので、production にも明示的に宣言する。
[env.production.version_metadata]
binding = "CF_VERSION_METADATA"
