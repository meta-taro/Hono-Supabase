# =============================================================================
# Cloudflare Workers 設定（cake-shop-api）
#
# このファイルは "本番デプロイ先（Workers）" 専用の設定。
# Node ローカル開発（pnpm dev）には一切影響しない — そちらは tsx watch +
# app/index.node.ts のままで動く。Phase 7 の二段運用ポリシー。
#
# wrangler の動かし方:
#   pnpm wrangler:dev      → ローカルで V8 isolate 上で起動（.dev.vars を読む）
#   pnpm wrangler:deploy   → 本番デプロイ（Cloudflare に登録した secret を使う）
#
# secrets と vars の使い分け:
#   - [vars]              … 機密でない設定（NODE_ENV, LOG_LEVEL 等）。コミット OK
#   - wrangler secret put … 機密値（Supabase キー等）。Cloudflare 側に保管、ローカルは .dev.vars
# =============================================================================

name = "cake-shop-api"
main = "app/index.workers.ts"
compatibility_date = "2026-05-07"

# Workers 標準モジュール構文（ExportedHandler）を有効化。
# nodejs_compat はあえて入れない:
#   本プロジェクトは jose / @supabase/supabase-js とも Web 標準 fetch ベースなので
#   Node ポリフィルは不要。これがないことが Workers 互換性の証拠でもある。
compatibility_flags = []

# 観測性: Workers の logs が dashboard 上で 24h 残る。本番ログは外部 (Logpush →
# Datadog 等) に流す前段として有効化しておく。
[observability]
enabled = true

# -----------------------------------------------------------------------------
# 機密でない設定値。ここに書いた値は wrangler deploy 時に同梱される。
# 本物の secrets（Supabase キー）は wrangler secret put で別経路で登録する。
# -----------------------------------------------------------------------------
[vars]
NODE_ENV = "production"
LOG_LEVEL = "info"

# -----------------------------------------------------------------------------
# 環境別オーバーライド（Step 8 で本格運用予定）
#   pnpm wrangler deploy --env staging  でこのブロックが適用される
# 今は雛形だけ置いておく。
# -----------------------------------------------------------------------------
[env.staging]
name = "cake-shop-api-staging"

[env.staging.vars]
NODE_ENV = "staging"
LOG_LEVEL = "debug"

[env.production]
name = "cake-shop-api"

[env.production.vars]
NODE_ENV = "production"
LOG_LEVEL = "info"
